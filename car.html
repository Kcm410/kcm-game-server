{const ib=document.querySelector('[data-a="i"]');if(ib)ib.style.display='';}

   [-1,1].forEach(sx=>{
     const g=new T.Group();g.position.set(sx*seatX,fy,rearZ);g.scale.setScalar(scale*.96);G.add(g);

     q(seatW,.10,.48,lea,0,.10,0);q(seatW,.47,.10,lea,0,.39,-.25);q(.2,.13,.07,lea,0,.70,-.30);
     q(.045,.14,.46,acc,-seatW*.46,.14,0);q(.045,.14,.46,acc,seatW*.46,.14,0);
   });
 }
 // 2. Door windows and side mirrors: opaque black, not transparent
 (cur.P.doors||[]).forEach(dr=>dr.traverse(o=>{if(o.isMesh&&o.material===GLASS_UP)o.material=BLACK_GLASS}));
 G.traverse(o=>{
   const p=o.isMesh&&o.geometry&&o.geometry.parameters;
   if(p&&o.geometry.type==='BoxGeometry'&&Math.abs(p.width-.1)<.001&&Math.abs(p.height-.08)<.001&&Math.abs(p.depth-.16)<.001)o.material=BLACK_GLASS;

window.VibingRPGarage.selectVehicle=select;

// ---------- LOOP ----------
let tick=0;
(function loop(){requestAnimationFrame(loop);tick++;if(rainbowGlow&&tick%2===0)rainbowStep();
 if(cur){const P=cur.P,s=cur.s,G=cur.G,Wp=cur.W,ws=P.wheels||[],nb=ws.filter(w=>w.burst).length,R0=4+Math.min(P.size,16)*.25;
  G.position.x*=.8;
  drive.v+=((drive.on&&!cur.dead?Math.max(.3,1-.18*nb):0)-drive.v)*.025;if(!drive.on&&drive.v<.004)drive.v=0;
  const u=(.03+(s.speed||60)/300*.12)*drive.v;
  if(drive.v>0){drive.a+=u/R0;Wp.position.set(R0*(Math.cos(drive.a)-1),0,R0*Math.sin(drive.a));Wp.rotation.y=-drive.a}
  else if(Wp.position.lengthSq()>1e-4||Math.abs(Wp.rotation.y)>1e-3){Wp.rotation.y-=Math.round(Wp.rotation.y/(2*PI))*2*PI;Wp.position.multiplyScalar(.9);Wp.rotation.y*=.9;drive.a=0}
  if(!cur.ev)tG.set(Wp.position.x,curFocusY,Wp.position.z);
  ws.forEach(w=>{w.sp.rotation.x+=u/w.r*(w.burst?.7:1);w.sc+=((w.burst?.62:1)-w.sc)*.25;w.w.scale.y=w.sc;w.w.scale.z=1+(1-w.sc)*.2;w.w.position.y=w.r*w.sc});
  spinMeshes.forEach(m=>m.rotation.x+=u/.5);

  Wp.updateMatrixWorld(true);
  const fwd=new T.Vector3(Math.sin(Wp.rotation.y),0,Math.cos(Wp.rotation.y)),r=cur.hp/s.hits;

  const ex=cur.ex;
  if(ex&&!cur.dead&&P.exh){if(cur.exhaustDamaged&&tick%2===0){const pp=G.localToWorld(P.exh[0].clone());puff(pp,0x171717,.48,.025,100,.65,-fwd.x*.03,-fwd.z*.03)}const idleOn=ex.idle&&tick%ex.rate==0,drvOn=drive.v>.05&&tick%Math.max(2,ex.rate-2)==0;
   if(idleOn||drvOn)P.exh.forEach(l=>{const pp=G.localToWorld(l.clone());puff(pp,ex.col,ex.size*(1+drive.v*.5),.006+drive.v*.004,ex.life,ex.op*(drvOn?1:.7),-fwd.x*(.015+drive.v*.03),-fwd.z*(.015+drive.v*.03))})}
  if(drive.v>.05)ws.forEach(w=>{if(!w.burst)return;const pp=w.w.getWorldPosition(new T.Vector3());pp.y=.03;
   for(let i=0;i<3;i++)spark(pp,-fwd.x*(.04+Math.random()*.05)+(Math.random()-.5)*.04,.02+Math.random()*.06,-fwd.z*(.04+Math.random()*.05)+(Math.random()-.5)*.04,14+Math.random()*10|0);
   if(tick%7==0)puff(pp,0x888888,.3,.01,40,.35,-fwd.x*.02,-fwd.z*.02)});
  if(P.rot)P.rot.rotation.y+=.5;if(P.rot2)P.rot2.rotation.x+=.6;if(P.bar){const f=tick%30<15;P.bar[0].emissiveIntensity=f?1.5:0;P.bar[1].emissiveIntensity=f?0:1.5}}
 dist+=(dG-dist)*.08;tgt.lerp(tG,.08);
 cam.position.set(tgt.x+dist*Math.sin(ph)*Math.sin(th),tgt.y+dist*Math.cos(ph),tgt.z+dist*Math.sin(ph)*Math.cos(th));cam.lookAt(tgt);
 parts.forEach(([o,k])=>{const u=o.userData;u.v+=(open[k]-u.v)*.2;o.rotation[u.ax]=u.v*u.open});
 if(cur&&cur.s.kind==='car'){cur.G.traverse(o=>{if(o.userData){if(o.userData.doorClearance)o.visible=open.d<.18;if(o.userData.cut)o.visible=!cur.cut}})}
 bits=bits.filter(m=>{m.position.add(m.userData.v);m.userData.v.y-=.012;if(m.position.y<0){m.position.y=0;m.userData.v.y*=-.35;m.userData.v.x*=.7;m.userData.v.z*=.7}if(--m.userData.life<=0){scene.remove(m);return false}return true});
 puffs=puffs.filter(p=>{const u=p.userData;p.position.add(u.v);u.life--;const k=1-u.life/u.max;p.scale.setScalar(u.s0*(1+k*2.2));p.material.opacity=u.op*(1-k);if(u.life<=0){scene.remove(p);p.material.dispose();return false}return true});
 audioTick();ren.render(scene,cam)})();

// ---------- FINAL WINDOW FIT: ONE DARK TINTED WINDOW SET PER CAR ----------
// Keep the door-mounted panes as the only side-door glass; tint front and rear screens too.
BLACK_GLASS.color.setHex(0x05080c);
BLACK_GLASS.opacity = 0.76;
BLACK_GLASS.metalness = 0.12;
BLACK_GLASS.roughness = 0.075;
BLACK_GLASS.clearcoat = 1;
BLACK_GLASS.clearcoatRoughness = 0.018;
BLACK_GLASS.envMapIntensity = 1.35;
BLACK_GLASS.depthWrite = false;
BLACK_GLASS.needsUpdate = true;
const _windowFitSelect = select;
select = function(s) {
  const ok = _windowFitSelect(s);
  if (!ok || !cur || cur.s !== s || s.kind !== 'car' || !cur.G) return ok;
  const G = cur.G;
  // Record all descendants of opening doors so their windows remain attached to them.
  const doorMeshes = new Set();
  (cur.P.doors || []).forEach(d => d.traverse(o => { if (o.isMesh) doorMeshes.add(o); }));
  G.updateMatrixWorld(true);
  G.traverse(o => {
    if (!o.isMesh || !o.geometry || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const looksLikeGlass = mats.some(m => m && (
      m === glassM || m === GLASS_UP || m === BLACK_GLASS ||
      /glass|window|windshield|windscreen/i.test((m.name || '') + ' ' + (m.userData && m.userData.part || '')) ||
      (m.transparent && m.opacity < .9 && m.color && m.color.b > .25 && m.color.r > .12)
    ));
    if (!looksLikeGlass) return;
    // User explicitly requested no side-window glass: hide side panes on imported vehicles too.
    // Keep the broad front/rear windscreen panes; hide thin-X side panes even if nested in doors.
    if (!o.userData.keepWindowFrame) {
      try {
        const b = new T.Box3().setFromObject(o), z = b.getSize(new T.Vector3());
        const center = b.getCenter(new T.Vector3());
        const isSidePane = z.x < .20 && z.y > .28 && z.z > .28 && Math.abs(center.x) > .22;
        if (isSidePane && !o.userData.kit) { o.visible = false; return; }
      } catch(e) {}
    }
    // Use the same dark tint on front/rear screens and door-mounted side glass.
    if (Array.isArray(o.material)) o.material = o.material.map(m => (m === glassM || m === GLASS_UP || looksLikeGlass) ? BLACK_GLASS : m);
    else o.material = BLACK_GLASS;
    o.material.side = T.DoubleSide;
    o.material.needsUpdate = true;
  });
  return ok;
};
window.VibingRPGarage.selectVehicle = select;
