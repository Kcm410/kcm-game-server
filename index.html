<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Game HDML - VIBING RP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{background:#000 url('background.jpg') no-repeat center/cover;font-family:Arial;display:flex;align-items:center;justify-content:center}
/* FORCE LANDSCAPE - NO ROTATE */
.box{background:rgba(0,0,0,0.9);border:2px solid #ffcc00;border-radius:18px;padding:28px;width:90%;max-width:380px;text-align:center}
.box h1{font-size:42px;color:#fff} .box h1 span{color:#ffcc00}
input{width:100%;padding:14px;margin:8px 0;background:#111;border:1px solid #333;border-radius:10px;color:#fff}
.btn{width:100%;padding:14px;background:#ffcc00;border:none;border-radius:10px;font-weight:900;font-size:18px;cursor:pointer}
#loading{position:fixed;inset:0;display:none;background:url('background.jpg') no-repeat center/cover;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:18vh}
#loading.show{display:flex}
.bar{width:60%;height:18px;background:rgba(0,0,0,0.7);border:1px solid #fff;border-radius:20px;overflow:hidden}
.fill{width:0%;height:100%;background:#ffcc00}
</style>

</div>

<div id="loading">

<div class="bar"><div class="fill" id="fill"></div></div>

</div>
