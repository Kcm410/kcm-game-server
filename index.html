<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game HDML - VIBING RP</title>
<style>
body{margin:0;background:url('background.jpg') no-repeat center/cover #000;height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial}
.box{background:rgba(0,0,0,0.9);border:2px solid #ffcc00;border-radius:18px;padding:28px;width:90%;max-width:360px;text-align:center}
h1{color:#fff;font-size:40px}h1 span{color:#ffcc00}
input{width:100%;padding:14px;margin:8px 0;background:#111;border:1px solid #333;border-radius:10px;color:#fff}
button{width:100%;padding:14px;background:#ffcc00;border:none;border-radius:10px;font-weight:900;font-size:18px}
</style>
</head>
<body>
<div class="box">
<h1>GAME <span>HDML</span></h1>
<p style="color:#aaa">Format: mike_jh</p>
<input id="rpname" placeholder="mike_jh">
<input id="rpPass" type="password" placeholder="Password min 4">
<button onclick="go()">SET USERNAME ▶</button>
</div>
<script>
function go(){
 let n=document.getElementById('rpname').value.trim();
 if(!n.includes('_')){alert('Use mike_jh format');return}
 localStorage.setItem('vibing_rp_name',n);
 location.href='game.html';
}
</script>
</body>
</html>
