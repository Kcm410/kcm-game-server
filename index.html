<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Game HDML</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#000}
body{margin:0;width:100vw;height:100vh;background:#000 url('background.jpg') no-repeat center/cover;display:flex;align-items:center;justify-content:center;overflow:hidden}

/* ALWAYS LANDSCAPE FROM FIRST PIXEL */
@media (orientation:portrait){
  body{
    width:100vh!important;
    height:100vw!important;
    transform:rotate(90deg);
    transform-origin:top left;
    position:absolute;
    top:0;
    left:100%;
  }
}

.box{background:rgba(0,0,0,0.9);border:2px solid #ffcc00;border-radius:18px;padding:24px;width:92%;max-width:360px;text-align:center}
h1{color:#fff;font-size:38px} h1 span{color:#ffcc00}
input{width:100%;padding:14px;margin:7px 0;background:#111;border:1px solid #333;border-radius:10px;color:#fff}
.btn{width:100%;padding:14px;background:#ffcc00;border:none;border-radius:10px;font-weight:900;font-size:18px}
#loading{position:fixed;inset:0;display:none;background:url('background.jpg') no-repeat center/cover;align-items:center;justify-content:center;flex-direction:column}
#loading.show{display:flex}
.bar{width:55%;height:16px;background:rgba(0,0,0,0.7);border:1px solid #fff;border-radius:20px;overflow:hidden;margin-top:10px}
.fill{width:0%;height:100%;background:#ffcc00}
</style>
</head>
<body>

<div id="login" class="box">
<h1>GAME <span>HDML</span></h1>
<p style="color:#aaa;font-size:12px;margin-bottom:10px">Format: mike_jh</p>
<input id="rpname" placeholder="mike_jh">
<input id="rpPass" type="password" placeholder="Password min 4">
<button class="btn" onclick="goLoad()">SET USERNAME ▶</button>
</div>

<div id="loading">
<div style="color:#fff;letter-spacing:4px">LOADING VIBING RP...</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="pct" style="color:#fff;margin-top:6px">0%</div>
</div>

<script>
function goLoad(){
 let n=document.getElementById('rpname').value.trim().replace('/','_');
 let pw=document.getElementById('rpPass').value;
 let a=n.split('_');
 if(a.length!=2){alert('Use mike_jh');return}
 if(pw.length<4){alert('Min 4');return}
 localStorage.setItem('vibing_rp_name',n);
 if(screen.orientation && screen.orientation.lock){screen.orientation.lock('landscape').catch(()=>{});}
 document.getElementById('login').style.display='none';
 document.getElementById('loading').classList.add('show');
 let p=0,fill=document.getElementById('fill'),pct=document.getElementById('pct');
 let t=setInterval(()=>{p+=Math.random()*12;if(p>=100){p=100;clearInterval(t);setTimeout(()=>location.href='game.html',500)}fill.style.width=p+'%';pct.innerText=Math.floor(p)+'%';},120);
}
</script>
</body>
</html>
