<!DOCTYPE html>
<html>
<head>
<title>Vibe RP - Naija GTA</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:20px;text-align:center}
.card{background:#1a1a1a;padding:25px;border-radius:15px;max-width:380px;margin:30px auto;border:2px solid #00ff88;box-shadow:0 0 20px #00ff8844}
input{width:92%;padding:14px;margin:8px 0;border-radius:10px;border:none;background:#2a2a2a;color:#fff;font-size:15px}
button{background:#00ff88;color:#000;padding:14px 30px;border:none;border-radius:10px;font-weight:bold;font-size:17px;width:97%;cursor:pointer;margin-top:10px}
button:active{transform:scale(0.98)}
h1{color:#00ff88;margin-bottom:5px}
#msg{margin-top:15px;font-weight:bold;min-height:20px}
.success{color:#00ff88}
.error{color:#ff4444}
</style>
</head>
<body>
<h1>🇳🇬 VIBE RP</h1>
<p>Port Harcourt's Realest RP</p>
<div class="card">
<h3>Create Account - ₦5000 FREE</h3>
<input id="username" placeholder="Username e.g DollaBoi">
<input id="email" type="email" placeholder="Email e.g dolla@gmail.com">
<input id="password" type="password" placeholder="Password (6+ chars)">
<button onclick="signup()">JOIN VIBE RP</button>
<p id="msg"></p>
</div>

<script>
const supabaseUrl = 'https://erpogyelelrtoysiopzu.supabase.co';
const supabaseKey = 'sb_publishable_zNsYWKuvoXbxiCxdI_e5Cg_CI9u0Taa';
const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

async function signup(){
 const username=document.getElementById('username').value.trim();
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value.trim();
 const msg=document.getElementById('msg');
 
 if(!username || !email || !password){ msg.className='error'; msg.innerText='Fill all fields!'; return; }

 msg.className=''; msg.innerText='Creating your Vibe RP account... ⏳';

 const { data, error: authError } = await supabaseClient.auth.signUp({ email, password });
 if(authError){ msg.className='error'; msg.innerText=authError.message; return; }
 if(!data.user){ msg.className='error'; msg.innerText='Check email for confirmation then login'; return; }

 const acc = Math.floor(1000000000 + Math.random()*9000000000).toString();

 const { error } = await supabaseClient.from('players').insert({
   id: data.user.id,
   username: username,
   email: email,
   cash: 5000,
   bank: 0,
   account_number: acc
 });

 if(error){ msg.className='error'; msg.innerText='DB Error: '+error.message; }
 else{ 
   msg.className='success'; 
   msg.innerText=`✅ WELCOME ${username}! Acc: ${acc} | Cash: ₦5000 | Go login!`; 
 }
}
</script>
</body>
</html>
